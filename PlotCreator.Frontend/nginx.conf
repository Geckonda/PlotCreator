server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed assets, no cache for the entry HTML
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Reverse-proxy /api/* to the api container (same-origin from the SPA's
    # point of view, so the auth cookie travels naturally).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        # Allow large entity content payloads
        client_max_body_size 25m;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    # SPA fallback — every other path serves index.html so client-side
    # routing works on hard reloads.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
